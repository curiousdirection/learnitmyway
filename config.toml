baseURL = "/" # is used as base for absURL and is overridden by HUGO_BASEURL env var
languageCode = "en"
title = "Learn it my way"

MetaDataFormat = "yaml"
DefaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy"]
pygmentsCodeFences = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 6

[params]
  description = "David's learning experiences as a self-taught software developer"
  shareImage = "img/share.png"
  author = "David"
  about = "Thanks for visiting Learn it my way! I created this website so I could share my learning experiences as a self-taught software developer."
  github = "https://github.com/curiousdirection"
  repoName = "learnitmyway"
  repoBranch = "main"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false