baseURL = "/" # is used as base for absURL and is overridden by HUGO_BASEURL env var
languageCode = "en"
title = "Learn it my way"

MetaDataFormat = "yaml"
DefaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy"]
pygmentsCodeFences = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 6

[params]
  description = "David's learning experiences as a self-taught software developer"
  shareImage = "img/share.png"
  author = "David"
  about = "Hi, I'm David, a product-minded senior engineer who left structural engineering to teach myself to code. In the 10+ years since, I've built full-stack web applications, most recently as tech lead of an e-commerce product team. Learn it my way is where I share what I've learned along the way."
  github = "https://github.com/curiousdirection"
  repoName = "learnitmyway"
  repoBranch = "main"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false