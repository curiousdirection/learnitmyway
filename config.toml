baseURL = "/" # is used as base for absURL and is overridden by HUGO_BASEURL env var
languageCode = "en"
title = "Learn it my way"

MetaDataFormat = "yaml"
DefaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy"]
pygmentsCodeFences = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 6

[params]
  description = "David's learning experiences as a self-taught software developer"
  shareImage = "img/share.png"
  author = "David"
  about = "Hi, I'm David. I'm a product-minded senior engineer with 10+ years of experience building full-stack web applications. Most recently, I was the tech lead of an e-commerce product team. Before that, I was a structural engineer, and I taught myself to code. I created this website so I could share my learning experiences along the way."
  github = "https://github.com/curiousdirection"
  repoName = "learnitmyway"
  repoBranch = "main"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false