{{ with $.Params.extraContent }}
<aside class="related">
  <h2 class="related__title">You might also like</h2>
  <ul class="related__list">
    {{ range $element := . }}
    <li>
      <a href="{{ $element.url }}" target="_blank" rel="noopener">{{ $element.title }}</a>
      {{ with $element.extras }}<span class="related__extras">{{ . }}</span>{{ end }}
    </li>
    {{ end }}
  </ul>
</aside>
{{ end }}
