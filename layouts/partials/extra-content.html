{{ with .Params.extraContent }}
<section class="blog-extras-container nested-links">
  <h2>
    You might also like:
  </h2>
  <ul class="extra-content-items">
    {{ range $element := . }}
    <li>
      <a href="{{ $element.url }}" target="_blank" rel="noopener">{{ $element.title }}</a>
      {{ if $element.extras}}
      {{ $element.extras }}
      {{end}}
    </li>
    {{end}}
  </ul>
</section>
{{ end }}
