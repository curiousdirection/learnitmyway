<script>
  (function () {
    var root = document.documentElement;
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    var buttons = document.querySelectorAll('.theme-toggle');

    function currentTheme() {
      return root.getAttribute('data-theme') || (media.matches ? 'dark' : 'light');
    }

    function updateButtons() {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      buttons.forEach(function (button) {
        button.hidden = false;
        button.setAttribute('aria-label', 'Switch to ' + next + ' theme');
      });
    }

    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        var theme = currentTheme() === 'dark' ? 'light' : 'dark';
        var followSystem = theme === (media.matches ? 'dark' : 'light');
        if (followSystem) {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', theme);
        }
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          var metaTheme = followSystem ? (meta.media.indexOf('dark') !== -1 ? 'dark' : 'light') : theme;
          meta.setAttribute('content', metaTheme === 'dark' ? '#1b1915' : '#fffaf0');
        });
        try {
          if (followSystem) {
            localStorage.removeItem('theme');
          } else {
            localStorage.setItem('theme', theme);
          }
        } catch (e) {}
        updateButtons();
      });
    });

    if (media.addEventListener) {
      media.addEventListener('change', updateButtons);
    }
    updateButtons();
  })();
</script>
