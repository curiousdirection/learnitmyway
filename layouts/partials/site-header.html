<header class="site-header">
  <div class="site-header__bar">
    {{ partial "theme-toggle.html" . }}
  </div>
  <div class="site-header__text">
    {{ partial "svg/cap.svg" (dict "size" "88" "class" "site-header__cap") }}
    <h1 class="site-header__header-text">
      {{ .Title | default .Site.Title }}
    </h1>
    <p class="site-header__subheader-text">
      <i>The more that you read, the more things you will know.
      The more that you learn, the more places you'll go.</i> - Dr. Seuss
    </p>
  </div>
</header>
