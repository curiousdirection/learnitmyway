<article class="summary">
  <h3 class="summary__title">{{ .Title }}</h3>
  {{ with .Params.excerpt }}
  <p class="summary__excerpt">{{ . }}</p>
  {{ end }}
  <p class="summary__meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2" }}</time>
    {{ with .Params.publisherInfo }}
    <span class="summary__publisher">{{ . }} <span aria-hidden="true">↗</span></span>
    {{ end }}
  </p>
</article>
